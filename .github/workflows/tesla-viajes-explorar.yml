name: tesla-viajes · exploración temporal de fuentes

on:
  push:
    branches: [claude/tesla-trip-planner-chargers-3b8my3]
    paths:
      - .github/workflows/tesla-viajes-explorar.yml

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Construir el JSON completo con datos reales
        run: |
          python3 tesla-viajes/scripts/construir_datos.py --salida /tmp/datos --min-estaciones 8000
          ls -la /tmp/datos
          gzip -k -9 /tmp/datos/estaciones.json && ls -la /tmp/datos

      - name: Operadores y estadísticas
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open('/tmp/datos/estaciones.json'))
          i = {c: k for k, c in enumerate(d['campos'])}
          n = collections.Counter(f[i['operador']] for f in d['estaciones'])
          for k, o in enumerate(d['operadores'][:70]):
              print(f"{n[k]:>5}  {o['id']:<8} {o['marca']:<40} | {o['razon_social']}")
          kws = collections.Counter()
          for f in d['estaciones']:
              for c in f[i['conectores']]:
                  if c[0] == 'C2' and c[1] == 'DC':
                      kws[int(c[3] // 50 * 50)] += c[6]
          print('Puntos CCS2 DC por potencia (tramos de 50 kW):', sorted(kws.items()))
          horarios = collections.Counter('24/7' if f[i['horario']] == '24/7' else ('desconocido' if f[i['horario']] is None else 'tramos') for f in d['estaciones'])
          print('Horarios:', horarios)
          pagos = collections.Counter(f[i['pagos']] for f in d['estaciones'])
          print('Combinaciones de pago más comunes:', pagos.most_common(15))
          PY

      - name: Capturar fixtures del corredor Madrid → Valencia
        run: |
          python3 tesla-viajes/scripts/capturar_fixtures.py --datos /tmp/datos/estaciones.json --salida tesla-viajes/test/fixtures
          ls -la tesla-viajes/test/fixtures

      - name: Estado de GitHub Pages del repositorio
        run: |
          curl -sS -o /dev/null -w "github.io/Proyectos/ -> HTTP %{http_code}\n" https://drraulferrer.github.io/Proyectos/ || true

      - name: Subir fixtures a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tesla-viajes/test/fixtures/estaciones-corredor.json tesla-viajes/test/fixtures/osrm-madrid-valencia.json
          git commit -m "tesla-viajes: fixtures reales del corredor Madrid → Valencia para probar la interfaz sin red"
          git push origin HEAD:claude/tesla-trip-planner-chargers-3b8my3
