name: tesla-viajes · exploración temporal de fuentes

on:
  push:
    branches: [claude/tesla-trip-planner-chargers-3b8my3]
    paths:
      - .github/workflows/tesla-viajes-explorar.yml
      - tesla-viajes/scripts/explorar_datex.py

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Listado del directorio DATEX II del MITERD en la DGT
        run: |
          curl -sS -m 60 https://infocar.dgt.es/datex2/v3/miterd/ \
            | python3 -c "import re,sys,html; t=sys.stdin.read(); print('\n'.join(html.unescape(x) for x in re.findall(r'href=\"([^\"]+)\"', t)))"
          for d in EnergyInfrastructureTablePublication; do
            echo "== $d"
            curl -sS -m 60 "https://infocar.dgt.es/datex2/v3/miterd/$d/" \
              | python3 -c "import re,sys,html; t=sys.stdin.read(); print('\n'.join(html.unescape(x) for x in re.findall(r'href=\"([^\"]+)\"', t)))"
          done

      - name: CSV de RIPREE (MITECO)
        run: |
          curl -sSL -m 300 -D cab.txt -o ripree.csv "https://energia.serviciosmin.gob.es/Ripree/ExportarInstalaciones/Export" || true
          cat cab.txt
          ls -la ripree.csv || true
          file ripree.csv || true
          head -c 4000 ripree.csv | iconv -f latin1 -t utf-8 2>/dev/null || head -c 4000 ripree.csv
          echo; wc -l ripree.csv || true

      - name: Recurso XML del catálogo MITECO
        run: |
          curl -sSL -m 60 "https://catalogo.datosabiertos.miteco.gob.es/catalogo/es/dataset/6ee8d46f-93bd-478f-8e29-3ba4f6d8405c/resource/8b73c0ea-9244-4a2b-a152-ba41fbd16b0b" \
            | python3 -c "import re,sys,html; t=sys.stdin.read(); print('\n'.join(sorted(set(html.unescape(x) for x in re.findall(r'href=\"([^\"]+)\"', t) if 'download' in x or x.endswith(('.xml','.csv','.zip')) or 'Export' in x))))"

      - name: URLs de API en el bundle de Mapa REVE
        run: |
          curl -sSL -m 60 https://www.mapareve.es/ -o reve.html
          for js in $(grep -oE '/assets/[^"]+\.js' reve.html | sort -u); do
            curl -sSL -m 60 "https://www.mapareve.es$js" -o b.js
            echo "== $js $(wc -c < b.js)B"
            grep -oE 'https?://[a-zA-Z0-9./_-]+' b.js | grep -viE 'w3.org|reactjs|mozilla|github|npm|fb.me|googleapis|gstatic|openstreetmap|mapbox|leaflet|apple.com|google.com|schema' | sort | uniq -c | sort -rn | head -40
            grep -oE '.{60}(api-contacto|x-api-key|apiKey|/api/v[0-9]|swagger|openapi).{80}' b.js | head -20
          done

      - name: Ruta OSRM con anotaciones (Madrid → Valencia)
        run: |
          curl -sS -m 60 -o osrm.json "https://router.project-osrm.org/route/v1/driving/-3.7038,40.4168;-0.3763,39.4699?overview=full&geometries=polyline6&steps=true&annotations=distance,duration,speed"
          ls -la osrm.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open('osrm.json'))
          r = d['routes'][0]
          print('distancia km', r['distance']/1000, 'duración h', r['duration']/3600)
          ann = r['legs'][0]['annotation']
          sp = collections.Counter(round(s*3.6/5)*5 for s in ann['speed'])
          dist_by_speed = collections.Counter()
          for s, dd in zip(ann['speed'], ann['distance']):
              dist_by_speed[round(s*3.6/5)*5] += dd/1000
          print('km por velocidad OSRM (km/h):', sorted((k, round(v,1)) for k, v in dist_by_speed.items()))
          clases = collections.Counter()
          for st in r['legs'][0]['steps']:
              for it in st.get('intersections', []):
                  for c in it.get('classes', []):
                      clases[c] += 1
          print('clases', clases)
          print('pasos', len(r['legs'][0]['steps']), 'segmentos', len(ann['speed']))
          print('ejemplo paso', json.dumps(r['legs'][0]['steps'][3])[:1500])
          PY
