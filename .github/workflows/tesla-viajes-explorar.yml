name: tesla-viajes · exploración temporal de fuentes

on:
  push:
    branches: [claude/tesla-trip-planner-chargers-3b8my3]
    paths:
      - .github/workflows/tesla-viajes-explorar.yml
      - tesla-viajes/scripts/explorar_datex.py

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Descargar XML DATEX II (DGT/MITERD)
        run: |
          curl -sS --compressed -m 600 -D cabeceras.txt -H "Origin: https://example.org" \
            -o electrolineras.xml \
            https://infocar.dgt.es/datex2/v3/miterd/EnergyInfrastructureTablePublication/electrolineras.xml
          cat cabeceras.txt
          ls -la electrolineras.xml
          head -c 3000 electrolineras.xml; echo

      - name: Analizar estructura
        run: python3 tesla-viajes/scripts/explorar_datex.py electrolineras.xml

      - name: Sondear publicaciones dinámicas y catálogo CKAN del NAP
        run: |
          for u in \
            https://infocar.dgt.es/datex2/v3/miterd/EnergyInfrastructureStatusPublication/electrolineras.xml \
            https://infocar.dgt.es/datex2/v3/miterd/EnergyInfrastructureStatusPublication/ \
            https://infocar.dgt.es/datex2/v3/miterd/ ; do
            echo "== $u"; curl -sS -m 60 -o /tmp/r -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u"; head -c 600 /tmp/r; echo
          done
          echo "== CKAN package_show"
          curl -sS -m 60 "https://nap.dgt.es/api/3/action/package_show?id=puntos-de-recarga-electrica-para-vehiculos" | head -c 8000; echo
          echo "== CKAN package_search recarga"
          curl -sS -m 60 "https://nap.dgt.es/api/3/action/package_search?q=recarga&rows=20" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(p['name'], '|', p.get('title'), '|', [r.get('url') for r in p.get('resources',[])]) for p in d['result']['results']]" || true

      - name: Sondear API pública de Mapa REVE
        run: |
          for u in https://www.mapareve.es/api-contacto https://www.mapareve.es/ ; do
            echo "== $u"
            curl -sSL -m 60 "$u" -o /tmp/p.html -w "HTTP %{http_code}\n"
            python3 - <<'PY'
          import re, html
          t = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          enlaces = sorted(set(re.findall(r'(?:href|src)="([^"]+)"', t)))
          print('ENLACES:', [e for e in enlaces if 'api' in e.lower() or 'doc' in e.lower() or e.endswith('.js')][:60])
          texto = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
          texto = html.unescape(re.sub(r'<[^>]+>', ' ', texto))
          print(re.sub(r'\s+', ' ', texto)[:4000])
          PY
          done

      - name: Catálogo datos.gob.es (RIPREE)
        run: |
          curl -sS -m 60 "https://datos.gob.es/apidata/catalog/dataset/e05068001-puntos-de-recarga-de-vehiculos-electricos.json" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for it in d['result']['items']:
              print('TITULO', it.get('title'))
              print('MODIFICADO', it.get('modified'))
              dist = it.get('distribution', [])
              dist = dist if isinstance(dist, list) else [dist]
              for x in dist:
                  print('DIST', x.get('format'), x.get('accessURL'), x.get('title'))
          " || true

      - name: Cabeceras CORS de servicios del navegador
        run: |
          probar() { echo "== $1"; curl -sS -m 40 -r 0-3000 -o /tmp/b -D - -H "Origin: https://drraulferrer.github.io" "$1" | grep -iE '^(HTTP|access-control|content-type|retry-after|x-ratelimit)' ; head -c 300 /tmp/b; echo; }
          probar "https://router.project-osrm.org/route/v1/driving/-3.7038,40.4168;-0.3763,39.4699?overview=false&annotations=maxspeed"
          probar "https://routing.openstreetmap.de/routed-car/route/v1/driving/-3.7038,40.4168;-0.3763,39.4699?overview=false"
          probar "https://api.open-meteo.com/v1/elevation?latitude=40.4,39.5&longitude=-3.7,-0.4"
          probar "https://api.open-meteo.com/v1/forecast?latitude=40.4,39.5&longitude=-3.7,-0.4&hourly=temperature_2m,wind_speed_10m,wind_direction_10m&forecast_days=1"
          probar "https://nominatim.openstreetmap.org/search?q=Valencia&format=json&limit=1&countrycodes=es"
          probar "https://photon.komoot.io/api/?q=Valencia&limit=1&lang=es"
          probar "https://api.openchargemap.io/v3/poi?output=json&countrycode=ES&maxresults=1"
          probar "https://tile.openstreetmap.org/6/31/24.png"
          probar "https://infocar.dgt.es/datex2/v3/miterd/EnergyInfrastructureTablePublication/electrolineras.xml" || true
