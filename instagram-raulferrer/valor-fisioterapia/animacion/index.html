<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1350" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: "Archivo"; font-weight: 500; src: url(assets/fonts/archivo-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 600; src: url(assets/fonts/archivo-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 700; src: url(assets/fonts/archivo-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 800; src: url(assets/fonts/archivo-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 900; src: url(assets/fonts/archivo-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
  :root { --ink: #171310; --nar: #FD6242; --nartxt: #BA4830; --line: #E3D8C5; --mut: #786D5E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #fff; font-family: "Archivo", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #root { position: relative; width: 1080px; height: 1350px; background: #fff; }
  #escena { position: absolute; inset: 0; }

  .cab { position: absolute; left: 80px; right: 80px; top: 64px; display: flex; align-items: center; justify-content: space-between; }
  .cab .marca { display: flex; align-items: center; gap: 18px; }
  .cab .marca img { width: 74px; }
  .cab .marca b { display: block; font-weight: 800; font-size: 25px; letter-spacing: -.01em; }
  .cab .marca small { display: block; font-weight: 700; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: var(--mut); margin-top: 3px; }
  .cab .pag { font-weight: 700; font-size: 20px; letter-spacing: .14em; color: var(--mut); }
  .num { position: absolute; right: 80px; top: 150px; font-weight: 900; font-size: 120px; line-height: 1; color: transparent; -webkit-text-stroke: 2px #D6CBB8; }
  .kick { position: absolute; left: 80px; top: 196px; font-weight: 700; font-size: 21px; letter-spacing: .28em; text-transform: uppercase; color: var(--nartxt); }
  .h { position: absolute; left: 80px; top: 244px; font-weight: 800; font-size: 92px; letter-spacing: -.035em; line-height: 1; }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; color: var(--nar); }

  .graf { position: absolute; left: 80px; right: 80px; top: 480px; height: 690px; }
  .base { position: absolute; left: 0; right: 0; top: 590px; height: 3px; background: var(--ink); transform-origin: left center; }
  .bar { position: absolute; width: 290px; transform-origin: center bottom; }
  #smi { left: 0; top: 156.6px; height: 433.4px; background: #E3D8C5; border-radius: 18px 18px 0 0; }
  #fis { left: 330px; top: 156.6px; height: 433.4px; background: var(--ink); }
  #dif { left: 330px; top: 110px; height: 46.6px; background: var(--nar); border-radius: 18px 18px 0 0; }
  .valor { position: absolute; font-weight: 800; font-size: 58px; letter-spacing: -.035em; color: var(--ink); white-space: nowrap; }
  .guia { position: absolute; left: 0; width: 630px; top: 155px; border-top: 3px dashed var(--nar); transform-origin: left center; }
  .llave { position: absolute; left: 650px; top: 110px; width: 22px; height: 48px; border: 3px solid var(--nar); border-left: none; }
  .gap { position: absolute; left: 690px; top: 100px; color: var(--nar); font-weight: 900; font-size: 56px; line-height: 1; letter-spacing: -.035em; white-space: nowrap; transform-origin: left center; }
  .gap small { display: block; font-weight: 600; font-size: 25px; letter-spacing: 0; color: var(--mut); margin-top: 12px; line-height: 1.35; }
  .etq { position: absolute; top: 610px; width: 340px; font-size: 24px; line-height: 1.35; color: var(--mut); }
  .etq b { display: block; color: var(--ink); font-weight: 800; font-size: 27px; }
  .nota { position: absolute; left: 80px; right: 80px; top: 1196px; font-size: 21px; color: var(--mut); }
  .pie { position: absolute; left: 80px; right: 80px; bottom: 60px; display: flex; align-items: center; justify-content: space-between; }
  .pie .usuario { font-weight: 700; font-size: 24px; }
  .pildora { display: inline-flex; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 18px 30px; font-weight: 700; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1350">
    <div id="escena" class="clip" data-start="0" data-duration="9" data-track-index="0">
      <div class="cab"><span></span><span class="pag">2/8</span></div>
      <div class="num">02</div>
      <div class="kick">SMI 2027 frente a convenio 2026</div>
      <div class="h">La <span class="serif">distancia</span>.</div>
      <div class="graf">
        <div class="bar" id="smi"></div>
        <div class="bar" id="fis"></div>
        <div class="bar" id="dif"></div>
        <div class="valor" id="vsmi" style="left:0;top:82px">0 €</div>
        <div class="valor" id="vfis" style="left:330px;top:36px">0 €</div>
        <div class="guia"></div>
        <div class="llave"></div>
        <div class="gap">138,25 €<small>un 10,8 % más<br>que el mínimo</small></div>
        <div class="base"></div>
        <div class="etq" id="esmi" style="left:0"><b>SMI 2027</b>anunciado, 14 pagas</div>
        <div class="etq" id="efis" style="left:330px"><b>Fisioterapeuta</b>salario base 2026,<br>sin antigüedad</div>
      </div>
      <div class="nota">Euros brutos por paga. Convenio de clínicas privadas de Madrid, anexo IV.</div>
      <div class="pie"><span></span><span class="pildora">Desliza →</span></div>
    </div>
  </div>
  <script>
    // Formato español: punto de miles y coma decimal, sin depender del locale del navegador
    function euros(v, dec) {
      const [ent, frac] = v.toFixed(dec).split(".");
      return ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (dec ? "," + frac : "") + " €";
    }
    const vsmi = document.getElementById("vsmi"), vfis = document.getElementById("vfis");
    const cSmi = { v: 0 }, cFis = { v: 0 };

    const tl = gsap.timeline({ paused: true });
    tl.from(".cab", { opacity: 0, y: -12, duration: 0.5, ease: "power2.out" }, 0);
    tl.from(".pie", { opacity: 0, duration: 0.5 }, 0.1);
    tl.from(".num", { opacity: 0, duration: 0.8 }, 0.15);
    tl.from(".kick", { opacity: 0, y: 16, duration: 0.5, ease: "power3.out" }, 0.2);
    tl.from(".h", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.3);
    tl.from(".base", { scaleX: 0, duration: 0.6, ease: "power2.out" }, 0.7);

    // Barra del SMI
    tl.from("#smi", { scaleY: 0, duration: 1.1, ease: "power3.out" }, 1.0);
    tl.from("#vsmi", { opacity: 0, duration: 0.3 }, 1.0);
    tl.to(cSmi, { v: 1286, duration: 1.1, ease: "power3.out", onUpdate: () => { vsmi.textContent = euros(cSmi.v, 0); } }, 1.0);
    tl.from("#esmi", { opacity: 0, y: 10, duration: 0.4 }, 1.4);

    // Barra del fisioterapeuta: sube hasta el mínimo...
    tl.from("#fis", { scaleY: 0, duration: 1.1, ease: "power3.out" }, 1.6);
    tl.from("#vfis", { opacity: 0, duration: 0.3 }, 1.6);
    tl.to(cFis, { v: 1286, duration: 1.1, ease: "power3.out", onUpdate: () => { vfis.textContent = euros(cFis.v, 0); } }, 1.6);
    tl.from("#efis", { opacity: 0, y: 10, duration: 0.4 }, 2.0);
    // ...y solo un poco más
    tl.from("#dif", { scaleY: 0, duration: 0.8, ease: "power2.out" }, 3.0);
    tl.to(cFis, { v: 1424.25, duration: 0.8, ease: "power2.out", onUpdate: () => { vfis.textContent = euros(cFis.v, 2); } }, 3.0);

    // La distancia
    tl.from(".guia", { scaleX: 0, duration: 0.7, ease: "power2.inOut" }, 3.9);
    tl.from(".llave", { opacity: 0, duration: 0.3 }, 4.5);
    tl.from(".gap", { opacity: 0, x: -16, scale: 0.85, duration: 0.5, ease: "back.out(2)" }, 4.6);
    tl.from(".nota", { opacity: 0, duration: 0.5 }, 5.3);
    tl.to("#dif", { opacity: 0.55, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 5.6);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
